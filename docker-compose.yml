# =============================================================================
# docker-compose.yml — AI Threat Hunting & Incident Response Platform
#
# Services (default profile)
#   postgres      PostgreSQL 16     — persistent storage for logs/threats/alerts
#   redis         Redis 7           — ML model cache, cooldown counters
#   backend       FastAPI           — AI detection + SOAR API  → :8000
#   frontend      React + nginx     — SOC dashboard            → :3000
#
# Optional profiles
#   --profile elk   adds elasticsearch:9200 + kibana:5601
#   --profile dev   replaces backend with hot-reload variant
#
# Quick start
#   cp .env.example .env
#   docker compose up -d --build
#   open http://localhost:3000
# =============================================================================

x-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &always
  restart: unless-stopped

# ---------------------------------------------------------------------------
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *always
    container_name: soc_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-socdb}
      POSTGRES_USER:     ${POSTGRES_USER:-socuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socpassword}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socuser} -d ${POSTGRES_DB:-socdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [soc_net]
    logging: *json-logging

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    <<: *always
    container_name: soc_redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redispass}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [soc_net]
    logging: *json-logging

  # ── Elasticsearch ─────────────────────────────────────── profile: elk ──────
  elasticsearch:
    image: elasticsearch:8.12.0
    <<: *always
    container_name: soc_elasticsearch
    profiles: ["elk"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # fine for local dev; enable + add certs in prod
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=soc-cluster
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [soc_net]
    logging: *json-logging

  # ── Kibana ──────────────────────────────────────────────── profile: elk ─────
  kibana:
    image: kibana:8.12.0
    <<: *always
    container_name: soc_kibana
    profiles: ["elk"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [soc_net]
    logging: *json-logging

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .                             # project root — gives access to whole tree
      dockerfile: docker/backend.Dockerfile
      target: runtime
    <<: *always
    container_name: soc_backend
    environment:
      # Application
      APP_ENV:           ${APP_ENV:-production}
      SECRET_KEY:        ${SECRET_KEY:-change-me-32chars-minimum}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
      WORKERS:           ${WORKERS:-2}
      # PostgreSQL
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-socuser}:${POSTGRES_PASSWORD:-socpassword}@postgres:5432/${POSTGRES_DB:-socdb}
      # Redis
      REDIS_URL:         redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      # Elasticsearch — only used when elk profile is active
      ES_URL:            http://elasticsearch:9200
      # ML training
      TRAIN_ON_STARTUP:  ${TRAIN_ON_STARTUP:-true}
      N_TRAIN_EVENTS:    ${N_TRAIN_EVENTS:-5000}
      MODEL_PATH:        /app/data/models
      # CORS — frontend origin; nginx container is the browser-facing host
      CORS_ORIGINS:      "http://localhost:${FRONTEND_PORT:-3000},http://frontend"
    volumes:
      - model_cache:/app/data/models   # IsolationForest survives container restarts
      - app_logs:/app/data/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s     # allow ~45s for IsolationForest training on startup
    networks: [soc_net]
    logging: *json-logging

  # ── Backend (dev — hot-reload) ────────────────────────────── profile: dev ───
  backend-dev:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    container_name: soc_backend_dev
    profiles: ["dev"]
    environment:
      APP_ENV:          development
      DATABASE_URL:     postgresql+asyncpg://${POSTGRES_USER:-socuser}:${POSTGRES_PASSWORD:-socpassword}@postgres:5432/${POSTGRES_DB:-socdb}
      REDIS_URL:        redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      TRAIN_ON_STARTUP: "true"
      N_TRAIN_EVENTS:   "1000"         # smaller set = faster dev startup
      CORS_ORIGINS:     "*"
    volumes:
      - .:/app                          # live source mount for --reload
      - model_cache:/app/data/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn backend.api.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir backend
        --log-level debug
    networks: [soc_net]

  # ── React frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ""               # empty → nginx proxy handles /api/*
    <<: *always
    container_name: soc_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [soc_net]
    logging: *json-logging

# ---------------------------------------------------------------------------
volumes:
  postgres_data:  { name: soc_postgres_data }
  redis_data:     { name: soc_redis_data }
  es_data:        { name: soc_es_data }
  model_cache:    { name: soc_model_cache }
  app_logs:       { name: soc_app_logs }

networks:
  soc_net:
    name: soc_network
    driver: bridge
