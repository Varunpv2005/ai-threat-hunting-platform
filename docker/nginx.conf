# =============================================================================
# nginx config — SOC Dashboard
# Serves the React SPA and proxies /api/* to the FastAPI backend.
# =============================================================================

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Suppress nginx version from headers and error pages.
    server_tokens off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header X-XSS-Protection       "1; mode=block"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Hashed static assets (JS/CSS bundles) ─────────────────────────────────
    # Vite appends content hashes to filenames, so aggressive caching is safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the FastAPI backend container.
    # This avoids CORS issues — the browser always talks to the same origin.
    location /api/ {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── WebSocket proxy (future /ws/alerts live feed) ─────────────────────────
    location /ws/ {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
    }

    # ── SPA fallback — all other routes return index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
